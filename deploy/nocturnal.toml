# Nocturnal on the observability VM (eq-perses). Data lives on the host.
[data]
dir = "/var/lib/nocturnal"

[log]
level = "info"
format = "json"

[discord]
guild_id = 1540111927995539506   # test server (legacy fork testing)
command_prefix = "controels-"
data_guild_id = 1169758926825324645  # serve the imported production ledger

[health]
bind = "127.0.0.1:8090"

# Telemetry is configured by the standard OpenTelemetry environment variables
# in /etc/nocturnal/env (OTEL_EXPORTER_OTLP_ENDPOINT / _PROTOCOL / _HEADERS,
# OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES, OTEL_SDK_DISABLED) — never by
# bot-specific keys.
