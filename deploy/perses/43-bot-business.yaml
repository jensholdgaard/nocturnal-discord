# Nocturnal, the guild's side: what the ledger records — commands, decisions, events,
# raids and attendance. Nothing here is about the process or the box; that is the
# Platform (48) and Infrastructure (49) dashboards. Project 'nocturnal', default
# Prometheus datasource. Metric names are the semconv registry's, as translated by
# Prometheus OTLP ingestion (dots -> underscores, _total for counters, _seconds for
# the s-unit histograms).
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: business
  project: nocturnal
spec:
  display:
    name: Business
  duration: 6h
  refreshInterval: 1m
  panels:
    stat_ledger_seq:
      kind: Panel
      spec:
        display:
          name: Ledger head (seq)
          description: Total events ever appended. Monotonic; a reset to a lower number would mean data loss.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max(nocturnal_ledger_seq) or vector(0)
    stat_commands_rate:
      kind: Panel
      spec:
        display:
          name: Commands / 5m
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(increase(nocturnal_commands_total[5m])) or vector(0)
    ts_active_work:
      kind: Panel
      spec:
        display:
          name: Open auctions and raids
          description: >-
            Concurrent work in the ledger. More than one active raid violates a
            core invariant; a long tail of open auctions means timers are not
            closing them.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (nocturnal_auction_flavor) (nocturnal_auctions_active)
                seriesNameFormat: '{{nocturnal_auction_flavor}} auctions'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(nocturnal_raids_active)
                seriesNameFormat: active raids
    ts_commands_by_kind:
      kind: Panel
      spec:
        display:
          name: Commands by kind
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (nocturnal_command) (rate(nocturnal_commands_total[5m]))
                seriesNameFormat: '{{nocturnal_command}}'
    ts_outcomes:
      kind: Panel
      spec:
        display:
          name: Decisions by outcome
          description: Rejections are healthy (typed refusals); errors are not.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (nocturnal_decision_outcome) (rate(nocturnal_commands_total[5m]))
                seriesNameFormat: '{{nocturnal_decision_outcome}}'
    ts_events_by_kind:
      kind: Panel
      spec:
        display:
          name: Ledger events by kind
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (nocturnal_event_kind) (rate(nocturnal_ledger_events_total[5m]))
                seriesNameFormat: '{{nocturnal_event_kind}}'
    ts_raid_attendance:
      kind: Panel
      spec:
        display:
          name: Raid attendance
          description: >-
            Players present at each tick of the running raid. Absent between
            raids by design — a gap means no raid, not an empty one. No player
            identity here; who was there is /listplayersdkps.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max(nocturnal_raid_attendance)
                seriesNameFormat: players present
    ts_attendance_average:
      kind: Panel
      spec:
        display:
          name: Average attendance %
          description: >-
            Mean of the attendance column /listplayersdkps shows, over the same
            rows it shows. Moves slowly: it is a 90-day window, so one raid
            nudges it, a month changes it.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
            yAxis:
              min: 0
              max: 100
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: avg(nocturnal_guild_attendance_average_percent)
                seriesNameFormat: guild average
    stat_profiles_current:
      kind: Panel
      spec:
        display:
          name: Profiles current
          description: >-
            Of the members who raided in the last 30 days, the share with a character profile
            newer than 14 days (from the meter or an upload). Coverage, not an SLO: the guild's
            behaviour, shown so officers can lean on it; /roster stale names who is missing.
            Green from 80 %.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent-decimal
              decimalPlaces: 0
            thresholds:
              steps:
                - value: 0
                  color: '#e6a700'
                - value: 0.8
                  color: '#5cb85c'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(nocturnal_roster_profiles_current) / clamp_min(sum(nocturnal_roster_raiders), 1)
    stat_raiders:
      kind: Panel
      spec:
        display:
          name: Raiders (30d)
          description: Members who attended a raid in the last 30 days - the people a profile is expected from.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: nocturnal_roster_raiders or vector(0)
    ts_profiles_by_source:
      kind: Panel
      spec:
        display:
          name: Profiles current, by door
          description: How many raiders are covered by a running meter and how many by an uploaded Zeal export, over time; the raider count as the ceiling.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            thresholds:
              mode: absolute
              steps: []
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (nocturnal_profile_source) (nocturnal_roster_profiles_current)
                seriesNameFormat: '{{nocturnal_profile_source}}'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: nocturnal_roster_raiders
                seriesNameFormat: raiders
  layouts:
  - kind: Grid
    spec:
      display:
        title: Right now
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 6
        height: 4
        content:
          $ref: '#/spec/panels/stat_ledger_seq'
      - x: 6
        y: 0
        width: 6
        height: 4
        content:
          $ref: '#/spec/panels/stat_commands_rate'
      - x: 12
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ts_active_work'
      - x: 0
        y: 4
        width: 6
        height: 4
        content:
          $ref: '#/spec/panels/stat_profiles_current'
      - x: 6
        y: 4
        width: 6
        height: 4
        content:
          $ref: '#/spec/panels/stat_raiders'
  - kind: Grid
    spec:
      display:
        title: Ledger
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ts_commands_by_kind'
      - x: 12
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ts_outcomes'
      - x: 0
        y: 8
        width: 24
        height: 8
        content:
          $ref: '#/spec/panels/ts_events_by_kind'
  - kind: Grid
    spec:
      display:
        title: Raids
        collapse:
          open: true
      items:
      - x: 0
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ts_raid_attendance'
      - x: 12
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ts_attendance_average'
      - x: 0
        y: 8
        width: 24
        height: 8
        content:
          $ref: '#/spec/panels/ts_profiles_by_source'
