# Traces: the recent ones, listed. Pick a service (the bot, Caddy, Prometheus, or
# members' Zeal) and the table shows the newest traces Jaeger has for it; a row's
# link opens the Spans dashboard for that trace. The Gantt lives there and not
# here on purpose: with no id chosen it renders an error, not an empty panel.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
  name: trace
  project: nocturnal
spec:
  display:
    name: Trace
  duration: 6h
  refreshInterval: 30s
  variables:
  - kind: ListVariable
    spec:
      name: service
      display:
        name: Service
        description: Who emitted the trace. nocturnal = the DKP bot; caddy = every request to the site and the OTLP ingest; prometheus = PromQL evaluations (sampled); everquest = members' Zeal fights.
      allowAllValue: false
      allowMultiple: false
      defaultValue: nocturnal
      plugin:
        kind: StaticListVariable
        spec:
          values:
          - nocturnal
          - caddy
          - prometheus
          - everquest
  panels:
    recent:
      kind: Panel
      spec:
        display:
          name: Recent traces
          description: Newest first, up to 50, within the time range. The trace id in a row is a link to its spans.
        plugin:
          kind: TraceTable
          spec:
            links:
              trace: /projects/nocturnal/dashboards/spans?var-trace=${traceId}
        queries:
        - kind: TraceQuery
          spec:
            plugin:
              kind: JaegerTraceQuery
              spec:
                datasource:
                  kind: JaegerDatasource
                  name: jaeger
                service: $service
                limit: 50
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 24
        height: 16
        content:
          $ref: '#/spec/panels/recent'
