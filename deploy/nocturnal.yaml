# Nocturnal on the observability VM (eq-perses). Data lives on the host.
data:
  dir: /var/lib/nocturnal

log:
  level: info
  format: json

discord:
  # Cutover 2026-08-30: production guild, unprefixed, under the NocturnalGuild
  # identity members already had. The registration guild IS the ledger guild,
  # so there is no remap and no prefix; the test-server identity is retired.
  guild_id: 1169758926825324645
  # Mirror this channel into Ourios as nocturnal.feedback.message (docs/feedback.md).
  # Needs the Message Content intent enabled in the developer portal FIRST (it is, since 2026-09-01).
  feedback_channel_id: 1544068940349579404
  # And these, by name, resolved at boot (2026-09-10): feedback is for the site,
  # bot-discussions for the bot.
  feedback_channel_names: ["bot-discussions"]

bell:
  enabled: true              # rings in the raid channels when a short auction opens

health:
  bind: 127.0.0.1:8090

# Off-site Parquet mirror of the compacted ledger; unset bucket = off.
archive:
  bucket: nocturnal-ledger
  prefix: prod

# Telemetry and archive credentials come from the standard environment in
# /etc/nocturnal/env — OTEL_* for telemetry, AWS_* for object storage — never
# from bot-specific keys.

# Roll sealed WAL segments into Parquet nightly. Without this the WAL only
# grows; nocturnal.wal.size on the Overview dashboard is what it costs.
compaction:
  interval_secs: 86400

# Telemetry provisioning (M8): the token commands, served under the bot members
# already have. Paths are the ones dpsbot.py owned; this process is now the only
# writer of both.
provision:
  # guild_id unset: single identity, /dpstoken registers with everything else.
  tokens_path: /etc/eq-otel/tokens.txt
  perses_provisioning_dir: /etc/perses/provisioning
  roles_map_path: /etc/eq-otel/roles.yaml
  dashboard_url: https://dps.nocturnal-guild.de/perses

# The guild roster page (M9): rendered from the ledger, served by Caddy at /roster/.
roster:
  output_path: /var/www/roster/data.json
  # Character profiles (everquest.character.profile events) come from Ourios.
  ourios_query_url: http://127.0.0.1:4320/v1/query
  ourios_tenant: nocturnal
  # Naming a raid from what it fought (raid-bosses.yaml is the boss table; edit freely).
  prometheus_query_url: http://127.0.0.1:9090/api/v1/query
  raid_bosses_path: /etc/nocturnal/raid-bosses.yaml
  # The Perses island, unpacked by the puller; the bot serves it under /assets.
  assets_dir: /var/www/site-assets/assets
