# Nocturnal on the observability VM (eq-perses). Data lives on the host.
data:
  dir: /var/lib/nocturnal

log:
  level: info
  format: json

discord:
  guild_id: 1540111927995539506       # test server (legacy fork testing)
  command_prefix: "controels-"
  data_guild_id: 1169758926825324645  # serve the imported production ledger

health:
  bind: 127.0.0.1:8090

# archive:                            # off-site Parquet mirror; unset = off
#   bucket: nocturnal-ledger
#   prefix: prod

# Telemetry and archive credentials come from the standard environment in
# /etc/nocturnal/env — OTEL_* for telemetry, AWS_* for object storage — never
