# Nocturnal on the observability VM (eq-perses). Data lives on the host.
data:
  dir: /var/lib/nocturnal

log:
  level: info
  format: json

discord:
  # Cutover 2026-08-30: production guild, unprefixed, under the NocturnalGuild
  # identity members already had. The registration guild IS the ledger guild,
  # so there is no remap and no prefix; the test-server identity is retired.
  guild_id: 1169758926825324645
  # Mirror this channel into Ourios as nocturnal.feedback.message (docs/feedback.md).
  # Needs the Message Content intent enabled in the developer portal FIRST.
  # feedback_channel_id: 1544068940349579404

bell:
  enabled: true              # rings in the raid channels when a short auction opens

health:
  bind: 127.0.0.1:8090

# archive:                            # off-site Parquet mirror; unset = off
#   bucket: nocturnal-ledger
#   prefix: prod
# compaction:                         # roll sealed WAL into Parquet on a timer
#   interval_secs: 86400              # nightly; unset = never, and the WAL only grows

# Telemetry and archive credentials come from the standard environment in
# /etc/nocturnal/env — OTEL_* for telemetry, AWS_* for object storage — never
# from bot-specific keys.
