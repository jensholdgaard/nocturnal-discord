[Service]
# The Discord token arrives as an encrypted credential rather than an environment
# variable. A process environment is readable through /proc/<pid>/environ, is
# inherited by anything the service spawns, and lands in crash dumps; a credential
# is decrypted into a private tmpfs only this unit can see.
#
# Encrypted against /var/lib/systemd/credential.secret, so it is host-bound by
# design: rebuild the VM and this file is scrap. Regenerating the token is the
# intended recovery, not restoring the ciphertext.
LoadCredentialEncrypted=bot_token:/etc/nocturnal/bot_token.cred
Environment=DISCORD_TOKEN_FILE=%d/bot_token
