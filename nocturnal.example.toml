# Nocturnal configuration — every key optional, shown with its default.
# Env overrides: NOCTURNAL_<SECTION>__<KEY>, e.g. NOCTURNAL_DATA__DIR.
# Secrets are env-only: DISCORD_TOKEN or DISCORD_TOKEN_FILE.

[data]
# dir = "/data"                # event log home: wal/ + events/ + LOCK
# wal_segment_max_bytes = 16_000_000
# compaction_interval = "1h"

[log]
# level = "info"               # or NOCTURNAL_LOG / RUST_LOG per-module
# format = "text"              # "json" in containers

# Telemetry: standard OpenTelemetry environment variables only —
# OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL (grpc |
# http/protobuf), OTEL_EXPORTER_OTLP_HEADERS, OTEL_SERVICE_NAME,
# OTEL_RESOURCE_ATTRIBUTES, OTEL_SDK_DISABLED. Unset endpoint = no export.

[archive]                      # off-site mirror of compacted Parquet history
# bucket = "nocturnal-ledger"  # unset = no archive
# prefix = "prod"
# Credentials/endpoint come from the standard AWS environment:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION

[health]
# bind = ""                    # e.g. "0.0.0.0:8080" → /healthz /readyz /metrics

[provision]                    # M8 — dpsbot successor; absent = commands disabled
# tokens_path = "/etc/eq-otel/tokens.txt"
# perses_provisioning_dir = "/etc/perses/provisioning"
# roles_map_path = "/etc/eq-otel/roles.yaml"
# dashboard_url = "https://dps.nocturnal-guild.de"
