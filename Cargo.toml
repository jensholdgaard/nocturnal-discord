[workspace]
resolver = "2"
members = [
    "crates/nocturnal-core",
    "crates/nocturnal-store",
    "crates/nocturnal-telemetry",
    "crates/nocturnal-discord",
    "crates/nocturnal-provision",
    "crates/nocturnal-migrate",
    "crates/nocturnal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jensholdgaard/nocturnal-discord"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
arrow-array = "56"
arrow-schema = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
poise = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
toml = "0.8"
anyhow = "1"
rustix = { version = "1", features = ["fs"] }
