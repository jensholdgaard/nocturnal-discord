[workspace]
resolver = "2"
members = [
    "crates/nocturnal-core",
    "crates/nocturnal-store",
    "crates/nocturnal-telemetry",
    "crates/nocturnal-discord",
    "crates/nocturnal-provision",
    "crates/nocturnal-migrate",
    "crates/nocturnal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jensholdgaard/nocturnal-discord"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
arrow-array = "56"
arrow-schema = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
object_store = { version = "0.12", features = ["aws"] }
futures = "0.3"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
poise = "0.6"
songbird = "0.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
# Not used directly: enables libopus static linking for songbird's audiopus,
# so the release binary stays a single static musl artifact.
audiopus_sys = { version = "0.2", features = ["static"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
toml = "0.8"
serde_yaml_ng = "0.10"
anyhow = "1"
rustix = { version = "1", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.23"
urlencoding = "2"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
