[package]
name = "nocturnal-store"
description = "Nocturnal event store: WAL append/replay with crash recovery; Parquet compaction (M2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nocturnal-core = { path = "../nocturnal-core" }
# Attribute *names* only. The store still instruments nothing itself — it
# emits plain `tracing` events — but their field names come from the registry
# like every other name in this workspace, so a typo is a compile error.
nocturnal-telemetry = { path = "../nocturnal-telemetry" }
serde_json.workspace = true
crc32fast.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
object_store.workspace = true
tracing.workspace = true
tokio = { workspace = true }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
