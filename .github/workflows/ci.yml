name: ci
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # songbird's vendored libopus ships a CMakeLists older than CMake 4 allows.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  semconv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt" }
      - name: weaver registry check + codegen drift
        run: |
          curl -sL -o weaver.tar.xz https://github.com/open-telemetry/weaver/releases/latest/download/weaver-x86_64-unknown-linux-gnu.tar.xz
          tar xf weaver.tar.xz
          ./weaver-x86_64-unknown-linux-gnu/weaver registry check -r semconv
          ./weaver-x86_64-unknown-linux-gnu/weaver registry generate -r semconv -t templates rust /tmp/gen
          # The committed file is rustfmt'd (clippy/fmt gate the whole tree),
          # so format the fresh generation the same way before diffing.
          rustfmt --edition 2021 /tmp/gen/generated.rs
          diff -u crates/nocturnal-telemetry/src/generated.rs /tmp/gen/generated.rs
