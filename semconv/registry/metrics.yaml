groups:
  # Cardinality rule: no actor/player ids on metrics — ever. Players live on
  # spans and in the ledger; metrics stay aggregate.
  - id: metric.nocturnal.commands
    type: metric
    metric_name: nocturnal.commands
    stability: development
    brief: Interactions processed by the single-writer core.
    instrument: counter
    unit: "{interaction}"
    attributes:
      - ref: nocturnal.command
      - ref: nocturnal.interaction.kind
      - ref: nocturnal.decision.outcome
      - ref: nocturnal.decision.rejection
        requirement_level:
          conditionally_required: when outcome is `rejected`
  - id: metric.nocturnal.interaction.ack.duration
    type: metric
    metric_name: nocturnal.interaction.ack.duration
    stability: development
    brief: >
      Gateway receive to Discord acknowledgment (defer). The legacy bot's
      3-second-window killer; alert well below 3s.
    instrument: histogram
    unit: s
    attributes:
      - ref: nocturnal.interaction.kind
  - id: metric.nocturnal.interaction.commit.duration
    type: metric
    metric_name: nocturnal.interaction.commit.duration
    stability: development
    brief: Gateway receive to fsynced ledger event (the real user-visible latency).
    instrument: histogram
    unit: s
    attributes:
      - ref: nocturnal.command
  - id: metric.nocturnal.ledger.events
    type: metric
    metric_name: nocturnal.ledger.events
    stability: development
    brief: Events appended to the ledger.
    instrument: counter
    unit: "{event}"
    attributes:
      - ref: nocturnal.event.kind
  - id: metric.nocturnal.ledger.seq
    type: metric
    metric_name: nocturnal.ledger.seq
    stability: development
    brief: Current head sequence number (progress + replay-lag indicator).
    instrument: gauge
    unit: "{event}"
  - id: metric.nocturnal.wal.fsync.duration
    type: metric
    metric_name: nocturnal.wal.fsync.duration
    stability: development
    brief: Duration of the per-event WAL fsync (hazard B7 watchdog).
    instrument: histogram
    unit: s
  - id: metric.nocturnal.wal.size
    type: metric
    metric_name: nocturnal.wal.size
    stability: development
    brief: >
      Bytes in unsealed WAL segments awaiting compaction. Nothing compacts on
      a timer today, so this only ever climbs — it is the number that says how
      much runway the disk has.
    instrument: gauge
    unit: By
  - id: metric.nocturnal.compaction.runs
    type: metric
    metric_name: nocturnal.compaction.runs
    stability: development
    brief: Compaction runs by outcome; any `error` is a page (hazard B5).
    instrument: counter
    unit: "{run}"
    attributes:
      - ref: nocturnal.compaction.partition
      - ref: nocturnal.decision.outcome
  - id: metric.nocturnal.auctions.active
    type: metric
    metric_name: nocturnal.auctions.active
    stability: development
    brief: Currently open auctions.
    instrument: gauge
    unit: "{auction}"
    attributes:
      - ref: nocturnal.auction.flavor
  - id: metric.nocturnal.raids.active
    type: metric
    metric_name: nocturnal.raids.active
    stability: development
    brief: Currently active raids (0 or 1 per guild by invariant — >1 is an alarm).
    instrument: gauge
    unit: "{raid}"
  - id: metric.nocturnal.raid.attendance
    type: metric
    metric_name: nocturnal.raid.attendance
    stability: development
    brief: >
      Players present at the active raid's most recent tick. Absent while no
      raid is running, so a raid night reads as a plateau and a quiet week as
      nothing — not as zero. Deliberately carries no player attribute: who was
      there is the ledger's answer (`/listplayersdkps`), never a metric label.
    instrument: gauge
    unit: "{player}"
  - id: metric.nocturnal.guild.attendance.average
    type: metric
    metric_name: nocturnal.guild.attendance.average
    stability: development
    brief: >
      Mean attendance percentage over the players `/listplayersdkps` would list
      (last activity inside the raid-deprecation window), computed by the
      guild's one attendance rule — best 8 of the last 10 raid weeks, the
      roster sheet's definition (docs/attendance.md) — through the same function
      the command uses, so the number here is the number officers see averaged.
      One series per guild, no player identity.
    instrument: gauge
    unit: "%"
  - id: metric.nocturnal.raid.active
    type: metric
    metric_name: nocturnal.raid.active
    stability: development
    brief: >
      1 while the raid is running, 0 in the minutes after it ends, then the
      series goes stale. An info-style series: one per raid night, from the
      bot, so dashboards can pick a raid by id and scope any query to its
      duration with `and on() (nocturnal_raid_active{...} == 1)`. Bounded
      cardinality — one series per raid, never per player.
    instrument: gauge
    # "{raid}", not "1": Prometheus' OTLP translation appends `_ratio` to a
    # unit-"1" gauge, and the first raid night's series landed under
    # nocturnal_raid_active_ratio while every dashboard queried the bare
    # name. Annotation units add no suffix.
    unit: "{raid}"
    attributes:
      - ref: nocturnal.raid.id
      - ref: nocturnal.raid.name
  - id: metric.nocturnal.scheduler.drift
    type: metric
    metric_name: nocturnal.scheduler.drift
    stability: development
    brief: >
      Lateness of timer firings (auction close, raid tick) vs their due
      instant. The single writer's saturation signal: when the core is
      backed up, drift moves before commit latency does.
    instrument: histogram
    unit: s
    attributes:
      - ref: nocturnal.scheduler.timer
  - id: metric.nocturnal.scheduler.heartbeat
    type: metric
    metric_name: nocturnal.scheduler.heartbeat
    stability: development
    brief: Scheduler cycles; absence of increase is the liveness page.
    instrument: counter
    unit: "{cycle}"
  - id: metric.nocturnal.provision.operations
    type: metric
    metric_name: nocturnal.provision.operations
    stability: development
    brief: Token/dashboard provisioning operations (usernames on spans only, never here).
    instrument: counter
    unit: "{operation}"
    attributes:
      - ref: nocturnal.provision.operation
      - ref: nocturnal.decision.outcome
  - id: metric.nocturnal.discord.ratelimit.delays
    type: metric
    metric_name: nocturnal.discord.ratelimit.delays
    stability: development
    brief: >
      Requests the Discord HTTP client delayed to respect rate limits — the
      early-warning signal that fires BEFORE Discord would return 429s.
    instrument: counter
    unit: "{delay}"
    attributes:
      - ref: nocturnal.discord.ratelimit.global
  - id: metric.nocturnal.discord.ratelimit.delay.duration
    type: metric
    metric_name: nocturnal.discord.ratelimit.delay.duration
    stability: development
    brief: How long rate-limited requests waited before being sent.
    instrument: histogram
    unit: s
    attributes:
      - ref: nocturnal.discord.ratelimit.global
  - id: metric.nocturnal.discord.gateway.latency
    type: metric
    metric_name: nocturnal.discord.gateway.latency
    stability: development
    brief: Gateway heartbeat round-trip latency (shard 0).
    instrument: gauge
    unit: s
  - id: metric.nocturnal.discord.reconnects
    type: metric
    metric_name: nocturnal.discord.reconnects
    stability: development
    brief: Gateway reconnects.
    instrument: counter
    unit: "{reconnect}"

  # ---------------------------------------------------------------------
  # Process/host saturation. The VM runs no node_exporter and the collector
  # only reports on itself, so the bot samples /proc/self and statvfs and
  # emits these under OpenTelemetry's own names — not ours — so any standard
  # dashboard reads them without translation.
  # ---------------------------------------------------------------------
  - id: metric.process.cpu.time
    type: metric
    metric_name: process.cpu.time
    stability: development
    brief: CPU time consumed by the bot process, split user/kernel.
    instrument: counter
    unit: s
    attributes:
      - ref: cpu.mode
  - id: metric.process.memory.usage
    type: metric
    metric_name: process.memory.usage
    stability: development
    brief: Resident set size. The replayed ledger lives here — growth is the leak signal.
    instrument: gauge
    unit: By
  - id: metric.process.memory.virtual
    type: metric
    metric_name: process.memory.virtual
    stability: development
    brief: Virtual address space size.
    instrument: gauge
    unit: By
  - id: metric.process.open_file_descriptors
    type: metric
    metric_name: process.open_file_descriptors
    stability: development
    brief: Open descriptors; a climbing count is the classic leak before EMFILE.
    instrument: gauge
    unit: "{count}"
  - id: metric.process.thread.count
    type: metric
    metric_name: process.thread.count
    stability: development
    brief: OS threads in the process (the tokio pool plus the single writer).
    instrument: gauge
    unit: "{thread}"
  - id: metric.process.uptime
    type: metric
    metric_name: process.uptime
    stability: development
    brief: Seconds since boot; a reset means the bot restarted.
    instrument: gauge
    unit: s
  - id: metric.system.filesystem.usage
    type: metric
    metric_name: system.filesystem.usage
    stability: development
    brief: >
      Bytes used and free on the filesystem holding the event store. The WAL
      grows until compaction runs; this is what says how long that is safe.
    instrument: gauge
    unit: By
    attributes:
      - ref: system.filesystem.state
      - ref: system.filesystem.mountpoint
